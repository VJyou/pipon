# Public web demo. Deploy from the repository root:
#   (cd app/verifier-demo && npm run build)
#   flyctl deploy --config deploy/fly/fly.toml --dockerfile deploy/fly/Dockerfile .
app = "pipon-demo"
primary_region = "nrt"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: a cold start would load the 0.9 GB zkey on the first proof.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/personas"

[[vm]]
  size = "shared-cpu-4x"
  memory = "4gb"
